[project]
name = "rag-agent-router"
version = "0.1.0"
description = "Router Agent — public gRPC gateway, intent classification, orchestration"
requires-python = ">=3.12"
dependencies = ["rag-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["router_agent"]

[tool.uv.sources]
rag-common = { workspace = true }
