[project]
name = "rag-agent-reranking"
version = "0.1.0"
description = "Reranking Agent — Jina reranker, relevance trimming, reference resolution"
requires-python = ">=3.12"
dependencies = [
    "rag-common",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reranking_agent"]

[tool.uv.sources]
rag-common = { workspace = true }
