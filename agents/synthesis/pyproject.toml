[project]
name = "rag-agent-synthesis"
version = "0.1.0"
description = "Synthesis Agent — LLM answer generation with citations"
requires-python = ">=3.12"
dependencies = ["rag-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthesis_agent"]

[tool.uv.sources]
rag-common = { workspace = true }
