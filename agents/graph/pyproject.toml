[project]
name = "rag-agent-graph"
version = "0.1.0"
description = "Graph Agent — Neo4j entity extraction, storage, graph expansion"
requires-python = ">=3.12"
dependencies = ["rag-common"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_agent"]

[tool.uv.sources]
rag-common = { workspace = true }
