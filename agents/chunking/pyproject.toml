[project]
name = "rag-agent-chunking"
version = "0.1.0"
description = "Chunking Agent — strategies, normalization, summarization"
requires-python = ">=3.12"
dependencies = [
    "rag-common",
    "docling-core>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chunking_agent"]

[tool.uv.sources]
rag-common = { workspace = true }
