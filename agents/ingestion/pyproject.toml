[project]
name = "rag-agent-ingestion"
version = "0.1.0"
description = "Ingestion Agent — preflight validation, Docling parsing, OCR"
requires-python = ">=3.12"
dependencies = [
    "rag-common",
    "docling>=2.16",
    "docling-core>=2.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion_agent"]

[tool.uv.sources]
rag-common = { workspace = true }
