services:
  # ══════════════════════════════════════════════
  # Infrastructure
  # ══════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ══════════════════════════════════════════════
  # Agents — ports 2060-2068
  # ══════════════════════════════════════════════

  router:
    build:
      context: ..
      dockerfile: agents/router/Dockerfile
    ports:
      - "2060:2060"
      - "9090:9090"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2060
      OTEL_SERVICE_NAME: rag-router
      OTEL_METRICS_PORT: 9090
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ingestion:
    build:
      context: ..
      dockerfile: agents/ingestion/Dockerfile
    ports:
      - "2061:2061"
      - "9091:9091"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2061
      OTEL_SERVICE_NAME: rag-ingestion
      OTEL_METRICS_PORT: 9091
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  chunking:
    build:
      context: ..
      dockerfile: agents/chunking/Dockerfile
    ports:
      - "2062:2062"
      - "9092:9092"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2062
      OTEL_SERVICE_NAME: rag-chunking
      OTEL_METRICS_PORT: 9092
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  embedding:
    build:
      context: ..
      dockerfile: agents/embedding/Dockerfile
    ports:
      - "2063:2063"
      - "9093:9093"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2063
      OTEL_SERVICE_NAME: rag-embedding
      OTEL_METRICS_PORT: 9093
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  retrieval:
    build:
      context: ..
      dockerfile: agents/retrieval/Dockerfile
    ports:
      - "2064:2064"
      - "9094:9094"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2064
      OTEL_SERVICE_NAME: rag-retrieval
      OTEL_METRICS_PORT: 9094
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  graph:
    build:
      context: ..
      dockerfile: agents/graph/Dockerfile
    ports:
      - "2065:2065"
      - "9095:9095"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2065
      OTEL_SERVICE_NAME: rag-graph
      OTEL_METRICS_PORT: 9095
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  reranking:
    build:
      context: ..
      dockerfile: agents/reranking/Dockerfile
    ports:
      - "2066:2066"
      - "9096:9096"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2066
      OTEL_SERVICE_NAME: rag-reranking
      OTEL_METRICS_PORT: 9096
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  synthesis:
    build:
      context: ..
      dockerfile: agents/synthesis/Dockerfile
    ports:
      - "2067:2067"
      - "9097:9097"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2067
      OTEL_SERVICE_NAME: rag-synthesis
      OTEL_METRICS_PORT: 9097
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  validation:
    build:
      context: ..
      dockerfile: agents/validation/Dockerfile
    ports:
      - "2068:2068"
      - "9098:9098"
    env_file: ../.env
    environment:
      AGENT_GRPC_PORT: 2068
      OTEL_SERVICE_NAME: rag-validation
      OTEL_METRICS_PORT: 9098
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  neo4j_data:
