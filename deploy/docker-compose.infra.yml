services:
  redis:
    image: redis:7-alpine
    ports:
      - "2050:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "2051:6333"  # REST
      - "2052:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5-community
    ports:
      - "2053:7474"  # Browser
      - "2054:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "2055:4317"   # OTLP gRPC
      - "2056:4318"   # OTLP HTTP
      - "2057:16686"  # Jaeger UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  redis_data:
  qdrant_data:
  neo4j_data:
