syntax = "proto3";
package rag.services.retrieval;

import "common/common.proto";

service RetrievalAgent {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc HybridSearch(HybridSearchRequest) returns (SearchResponse);
  rpc BatchSearch(BatchSearchRequest) returns (BatchSearchResponse);
  rpc StoreChunks(StoreChunksRequest) returns (StoreChunksResponse);
}

message SearchRequest {
  string query_text = 1;
  optional rag.common.EmbeddingVector query_vector = 2;
  uint32 limit = 3;
  float score_threshold = 4;
  repeated string collection_names = 5;
  map<string, string> filters = 6;
  rag.common.TraceContext trace_context = 7;
}

enum FusionMethod {
  FUSION_METHOD_UNSPECIFIED = 0;
  FUSION_METHOD_RRF = 1;
  FUSION_METHOD_CONVEX = 2;
}

message HybridSearchRequest {
  string query_text = 1;
  rag.common.EmbeddingVector dense_vector = 2;
  rag.common.SparseVector sparse_vector = 3;
  uint32 limit = 4;
  float score_threshold = 5;
  FusionMethod fusion_method = 6;
  optional float fusion_weight = 7;
  repeated string collection_names = 8;
  map<string, string> filters = 9;
  rag.common.TraceContext trace_context = 10;
}

message SearchResponse {
  rag.common.OperationResult result = 1;
  repeated rag.common.RetrievedChunk chunks = 2;
}

message BatchSearchRequest {
  repeated SearchRequest searches = 1;
}

message BatchSearchResponse {
  repeated SearchResponse responses = 1;
}

message StoreChunksRequest {
  string collection_name = 1;
  repeated ChunkWithVectors chunks = 2;
  rag.common.TraceContext trace_context = 3;
}

message ChunkWithVectors {
  rag.common.Chunk chunk = 1;
  rag.common.HybridVectors vectors = 2;
}

message StoreChunksResponse {
  rag.common.OperationResult result = 1;
  uint32 stored_count = 2;
}
