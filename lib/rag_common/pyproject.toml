[project]
name = "rag-common"
version = "0.1.0"
description = "Shared library for RAG swarm agents"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "grpcio-health-checking>=1.68",
    "grpcio-reflection>=1.68",
    "protobuf>=5.29",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "neo4j>=5.27",
    "litellm>=1.57",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-grpc>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-redis>=0.50b0",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "tenacity>=9.0",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.force-include]
"." = "rag_common"
